# Example dashboard for Tenniscompetitie: one section per player.
# Settings → Dashboards → Add dashboard → New dashboard from scratch, then ⋮ → Edit → ⋮ → Raw
# configuration editor, and paste this. Replace `sam_de_vries` with your player's entity names
# (sensor.<player>_singles_rating, …) and copy the section for every player you follow. The
# "Tournament entries" heading and card only work for the account's own player: leave them out
# for the others. The rating graph fills from the day the integration was added.
views:
- title: Tennis
  path: tennis
  icon: mdi:tennis
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Sam de Vries
      icon: mdi:tennis
    - type: markdown
      content: |-
        | | Playing strength | Rating | Next season |
        |:--|:-:|:-:|:-:|
        {%- set ns = namespace(next=none) %}
        {%- for label, key in [('Singles', 'singles'), ('Doubles', 'doubles'), ('Padel', 'padel')] %}
        {%- set e = 'sensor.sam_de_vries_' ~ key ~ '_rating' %}
        {%- if states(e) not in ['unknown', 'unavailable'] %}
        | {{ label }} | **{{ state_attr(e, 'playing_strength') }}** | {{ '%.4f' | format(states(e) | float) | replace('.', '.') }} | {{ state_attr(e, 'next_playing_strength') or '–' }} {{ {'up': '▲', 'down': '▼'}.get(state_attr(e, 'trend'), '') }} |
        {%- if state_attr(e, 'next_from') %}{% set ns.next = state_attr(e, 'next_from') %}{% endif %}
        {%- endif %}
        {%- endfor %}

        {% if ns.next %}Next season applies from {{ as_datetime(ns.next).strftime('%-d-%-m-%Y') }}.{% endif %}
    - type: heading
      heading: Seasons
      heading_style: subtitle
    - type: markdown
      content: |-
        | Season | Singles | Doubles |
        |:--|:-:|:-:|
        {%- set s1 = state_attr('sensor.sam_de_vries_singles_rating', 'seasons') or [] %}
        {%- set s2 = state_attr('sensor.sam_de_vries_doubles_rating', 'seasons') or [] %}
        {%- for s in s1[:6] %}
        {%- set d = s2 | selectattr('season', 'eq', s.season) | first %}
        | {{ s.season | replace('Seizoen ', '') }} | {% if s.matches %}{{ s.playing_strength }} · {{ '%.2f' | format(s.end_rating) | replace('.', '.') }}{% else %}–{% endif %} | {% if d and d.matches %}{{ d.playing_strength }} · {{ '%.2f' | format(d.end_rating) | replace('.', '.') }}{% else %}–{% endif %} |
        {%- endfor %}
    - type: tile
      entity: sensor.sam_de_vries_matches_won_this_year
      name: Won this year
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sam_de_vries_matches_lost_this_year
      name: Lost this year
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sam_de_vries_last_result
      name: Last result
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.sam_de_vries_ranking
      name: Ranking
      grid_options:
        columns: 6
    - type: heading
      heading: Next match
      heading_style: subtitle
    - type: markdown
      content: |-
        {%- set e = 'sensor.sam_de_vries_next_match' %}
        {%- if states(e) not in ['unknown', 'unavailable'] %}
        {%- set t = as_local(as_datetime(states(e))) %}
        **{{ ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][t.weekday()] }} {{ t.strftime('%-d-%-m %H:%M') }}** · {{ state_attr(e, 'event') }}{% if state_attr(e, 'round') %} · {{ state_attr(e, 'round') }}{% endif %}{% if state_attr(e, 'draw') %} · {{ state_attr(e, 'draw') }}{% endif %}
        {%- if state_attr(e, 'kind') == 'competition' %}
        {{ state_attr(e, 'home') }} – {{ state_attr(e, 'away') }}
        {%- if state_attr(e, 'plays') %}
        Plays: {{ state_attr(e, 'plays') | join(', ') }}
        {%- endif %}
        {%- else %}
        {%- set partners = state_attr(e, 'partners') or [] %}
        {{ ('With ' ~ partners | join(' / ') ~ ' against ') if partners else 'Against ' }}{{ (state_attr(e, 'opponents') or []) | join(' / ') }}
        {%- endif %}
        {%- if state_attr(e, 'venue') %}
        {{ state_attr(e, 'venue') }}{% if state_attr(e, 'address') %}, {{ state_attr(e, 'address') }}{% endif %}
        {%- endif %}
        {%- else %}No match planned yet.{% endif %}
    - type: heading
      heading: Tournament entries
      heading_style: subtitle
    - type: markdown
      content: |-
        {%- for x in state_attr('sensor.sam_de_vries_tournament_entries', 'entries') or [] %}
        **{{ x.tournament }}** · {{ as_datetime(x.start).strftime('%-d-%-m') }}{% if x.end and x.end != x.start %} to {{ as_datetime(x.end).strftime('%-d-%-m') }}{% endif %}
        {{ x.events | join(', ') }}{% if x.status %} · {{ x.status }}{% endif %}{% if x.priority %} · preference {{ x.priority }}{% endif %}
        {%- else %}
        No entries.
        {%- endfor %}
    - type: heading
      heading: Last match
      heading_style: subtitle
    - type: markdown
      content: |-
        {%- set e = 'sensor.sam_de_vries_last_match' %}
        {%- if states(e) not in ['unknown', 'unavailable'] %}
        **{{ as_datetime(states(e)).strftime('%-d-%-m-%Y') }} · {{ 'Won' if state_attr(e, 'result') == 'won' else 'Lost' }}** {{ state_attr(e, 'score') or '' }}
        {{ state_attr(e, 'event') }}{% if state_attr(e, 'round') %} · {{ state_attr(e, 'round') }}{% endif %}{% if state_attr(e, 'draw') %} · {{ state_attr(e, 'draw') }}{% endif %}
        {%- set partners = state_attr(e, 'partners') or [] %}
        {{ ('With ' ~ partners | join(' / ') ~ ' against ') if partners else 'Against ' }}{{ (state_attr(e, 'opponents') or []) | join(' / ') }}{% if state_attr(e, 'opponent_team') %} ({{ state_attr(e, 'opponent_team') }}){% endif %}
        {%- else %}No match known yet.{% endif %}
    - type: heading
      heading: Competition
      heading_style: subtitle
    - type: tile
      entity: sensor.sam_de_vries_competition_position
      name: Pool position
    - type: markdown
      content: |-
        {%- set e = 'sensor.sam_de_vries_competition_position' %}
        {%- if state_attr(e, 'competition') %}
        **{{ state_attr(e, 'competition') }}**
        {%- for team in state_attr(e, 'teams') %}
        {{ team.team }}: **{{ team.position }}**{% if team.played %} after {{ team.played }} matches{% endif %} · {{ team.category }}{% if team.level %}, {{ team.level }}{% endif %}
        {%- endfor %}
        {%- if state_attr(e, 'wins') is not none %}
        Own matches: {{ state_attr(e, 'wins') }}–{{ state_attr(e, 'losses') }}
        {%- endif %}
        {%- else %}No competition known.{% endif %}
    - type: markdown
      content: |-
        {%- set rows = state_attr('sensor.sam_de_vries_competition_position', 'standing') or [] %}
        {%- if rows %}
        | # | Team | P | Pts |
        |:-:|:--|:-:|:-:|
        {%- for r in rows %}
        | {{ r.position }} | {{ ('**' ~ r.team ~ '**') if r.own_team else r.team }} | {{ r.played }} | {{ r.points }} |
        {%- endfor %}
        {%- endif %}
    - type: statistics-graph
      title: Rating over time
      entities:
      - sensor.sam_de_vries_singles_rating
      - sensor.sam_de_vries_doubles_rating
      chart_type: line
      period: month
      days_to_show: 1825
      stat_types:
      - mean
    - type: calendar
      title: Matches
      entities:
      - calendar.sam_de_vries_matches
      initial_view: dayGridMonth
